name: vZEV Abrechnung
version: "0.19.0"
slug: vzev
description: vZEV-Abrechnung – Primeo-Lastgänge, Ladestation, Rechnungen mit QR-Einzahlungsschein
url: https://github.com/khu1985/vzev-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: vZEV
homeassistant_api: true
map:
  - addon_config:rw
backup: hot
backup_exclude:
  - "**/.cache/**"
  - "**/*.pkl"
  - "**/*.tmp"
options:
  evcc_passwort: ""
schema:
  evcc_passwort: password?
